name: verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_EC2_METADATA_DISABLED: 'true'
jobs:
  terraform:
    name: Terraform ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.15.8', '1.17.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - run: python -m pip install -r requirements-ci.txt
      - name: Format, initialize and validate every module and example
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          for directory in . modules/namespace modules/cluster-services modules/pod-identity examples/cluster examples/policies; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate -no-color
          done
      - name: Native plans and source mutation tests
        run: python scripts/test_regressions.py --mutations
      - name: Bind evidence to source commit
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: terraform-${{ matrix.version }}-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  static:
    name: Lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: bash scripts/install_tools.sh "$RUNNER_TEMP/tools"
      - name: Workflow and Terraform lint
        run: |
          set -euo pipefail
          python scripts/verify_workflow.py
          "$RUNNER_TEMP/tools/actionlint"
          for directory in . modules/namespace modules/cluster-services modules/pod-identity examples/cluster examples/policies; do
            "$RUNNER_TEMP/tools/tflint" --chdir="$directory" --config="$PWD/.tflint.hcl" --format=compact
          done
      - name: Scan authored Terraform (upstream source excluded)
        run: |
          mkdir -p artifacts
          checkov -d . --framework terraform --skip-path .terraform --download-external-modules false --skip-download --output json > artifacts/checkov.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: static-${{ github.sha }}
          path: artifacts/
          retention-days: 14
  admission:
    name: Kubernetes admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - run: bash scripts/install_tools.sh "$RUNNER_TEMP/tools"
      - name: Create disposable local Kubernetes cluster
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/kind" create cluster --name eks-baseline-admission --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/kubeconfig" --wait 120s
      - name: Real admission allow/deny checks
        run: python3 scripts/test_admission.py --kubeconfig "$RUNNER_TEMP/kubeconfig"
      - name: Remove disposable cluster
        if: always()
        run: '"$RUNNER_TEMP/tools/kind" delete cluster --name eks-baseline-admission'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: admission-${{ github.sha }}
          path: artifacts/
          retention-days: 14
